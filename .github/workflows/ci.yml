name: CI

on:
  push:
    branches: [main]
  pull_request:

# One run per branch; a newer push cancels the older run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Test, typecheck, build, compliance
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Unit tests (core, compliance gate, mobile)
        run: npm test
      - name: Typecheck (core, web, mobile)
        run: npm run typecheck
      - name: Build the website
        run: npm run build:web
      - name: AdSense compliance gate (ad-free build)
        run: npm run check:compliance
      - name: Bundle the Android app (proves the shared core bundles)
        run: npm run bundle:mobile
        env:
          CI: "1"
      - name: Audit production dependencies (report only; accepted advisories are in docs/07)
        run: npm audit --omit=dev || true
      - uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: apps/web/dist
          retention-days: 7

  lighthouse:
    name: Lighthouse budgets
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build:web
      - name: Lighthouse CI (fails when a budget in lighthouserc.json is missed)
        run: npx --yes @lhci/cli@0.15.x autorun --config=lighthouserc.json
